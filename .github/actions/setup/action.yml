name: Setup RelightLab Dependencies
description: Install Qt, MSVC, dependencies, and setup ccache

inputs:
  qt_version:
    description: 'Qt version to install'
    required: true

runs:
  using: composite
  steps:
    - name: Setup MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ github.ref }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: 'true'
        version: ${{ inputs.qt_version }}

    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-common-dev libglu1-mesa-dev 
        sudo apt-get install -y cmake ninja-build patchelf fuse libjpeg-dev libtiff-dev libeigen3-dev
        sudo apt-get install -y libxcb-cursor0
        sudo apt-get install -y liblcms2-dev libpng-dev libexiv2-dev
        sudo apt-get install -y --no-install-recommends libopencv-dev

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install coreutils libomp eigen jpeg-turbo libtiff libpng exiv2 opencv
        npm install -g appdmg

    - name: Configure vcpkg binary cache
      if: runner.os == 'Windows'
      id: vcpkg-cache-key
      shell: bash
      run: |
        echo 'VCPKG_ROOT=C:/vcpkg' >> "$GITHUB_ENV"
        echo 'VCPKG_DEFAULT_BINARY_CACHE=C:/vcpkg/binary-cache' >> "$GITHUB_ENV"
        echo 'VCPKG_BINARY_SOURCES=clear;files,C:/vcpkg/binary-cache,readwrite' >> "$GITHUB_ENV"

        VCPKG_REV=$(git -C C:/vcpkg rev-parse HEAD)
        MSVC_VERSION=$(cl 2>&1 | sed -n '1p' | sha256sum | cut -c1-12)
        SETUP_HASH=$(sha256sum .github/actions/setup/action.yml | cut -c1-12)
        echo "key=vcpkg-bin-Windows-x64-windows-${VCPKG_REV}-${MSVC_VERSION}-${SETUP_HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore vcpkg binary cache
      if: runner.os == 'Windows'
      uses: actions/cache@v4
      with:
        path: C:/vcpkg/binary-cache
        key: ${{ steps.vcpkg-cache-key.outputs.key }}
        restore-keys: |
          vcpkg-bin-Windows-x64-windows-

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: bash
      run: |
        C:/vcpkg/vcpkg.exe install opencv:x64-windows libjpeg-turbo:x64-windows tiff:x64-windows lcms:x64-windows libpng:x64-windows zlib:x64-windows exiv2:x64-windows
        choco install nsis -y

    - name: Debug zlib output
      if: runner.os == 'Windows'
      shell: bash
      run: |
        find C:/vcpkg/packages/zlib_x64-windows -name '*.dll'
        find C:/vcpkg/installed/x64-windows/bin -name 'zlib*' || echo "nothing in installed/bin"
